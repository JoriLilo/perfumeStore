<!-- Google Fonts -->

<header class="scente-header" id="scente-header">

  <!-- Top bar -->

    <!-- Logo -->

    <!-- Desktop nav links -->

      <li><a href="../index.html">Home</a></li>

      <li>
        <a href="../pages/shop.html">Perfumes</a>
        <div class="scente-dropdown">
         <a href="../pages/shop.html?gender=women">Women</a>
         <a href="../pages/shop.html?gender=men">Men</a>
        <a href="../pages/shop.html?gender=unisex">Unisex</a>


        </div>
      </li>

      <!-- Sale link - commented out for now -->
      <!-- <li>
        <a href="../pages/shop.html?cat=sale" class="nav-sale">Sale</a>
      </li> -->
    </ul>

    <!-- Desktop action icons -->
    <div class="scente-icons">
      <button class="scente-icon-btn" onclick="toggleSearch()" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
      <a href="/pages/wishlist.html" class="scente-icon-btn" aria-label="Wishlist">
        <i class="bi bi-heart"></i>
      </a>
      <a href="/pages/cart.html" class="scente-icon-btn" aria-label="Cart">
        <i class="bi bi-bag"></i>
        <span class="scente-badge" id="cart-count">0</span>
      </a>
      <!-- Profile link - controlled by JS -->
      <a href="/pages/login.html" id="profile-link" class="scente-icon-btn" aria-label="Account">
        <i class="bi bi-person"></i>
      </a>
    </div>

    <!-- Mobile: cart + hamburger -->
    <div class="scente-mobile-right">
      <a href="../pages/cart.html" class="scente-icon-btn" aria-label="Cart">
        <i class="bi bi-bag"></i>
        <span class="scente-badge" id="cart-count-mobile">0</span>
      </a>
      <button
        class="scente-hamburger"
        data-bs-toggle="offcanvas"
        data-bs-target="#scenteMobileMenu"
        aria-label="Open menu"

        <i class="bi bi-list"></i>
      </button>
    </div>

  </div>

  <!-- Expanding search bar -->
  <div class="scente-search-bar" id="scente-search-bar">
    <div class="scente-search-inner">
      <i class="bi bi-search"></i>
      <input
        type="search"
        id="scente-search-input"
        placeholder="Search for a perfume or brand…"
        autocomplete="off"
        onkeypress="if(event.key==='Enter') performSearch()"
      />
      <button onclick="performSearch()" aria-label="Search" style="margin-right: 8px;">
        <i class="bi bi-arrow-right"></i>
      </button>
      <button onclick="toggleSearch()" aria-label="Close search">
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>

  <!-- Announcement bar -->
  <div class="scente-announcement" id="scente-announcement">
    FREE SHIPPING
    <span class="dot">·</span>
    Orders over $50
    <span class="dot">·</span>
    Use code <strong>SCENTE10</strong> for 10% off your first order
    <button class="scente-ann-close" onclick="closeAnn()" aria-label="Close">
      <i class="bi bi-x"></i>
    </button>
  </div>

</header>

          Perfumes <i class="bi bi-chevron-down"></i>
        </a>
        <div class="collapse" id="mobPerf">
          <ul class="scente-mob-sub">
             <li><a href="../pages/shop.html?gender=women">Women</a></li>
              <li><a href="../pages/shop.html?gender=men">Men</a></li>
              <li><a href="../pages/shop.html?gender=unisex">Unisex</a></li>
  
          </ul>
        </div>
      </li>
      <li>
        <a href="#mobBrands" data-bs-toggle="collapse">
          Brands <i class="bi bi-chevron-down"></i>
        </a>
        <div class="collapse" id="mobBrands">
          <ul class="scente-mob-sub">
            <li><a href="../pages/shop.html?brand=chanel">Chanel</a></li>
            <li><a href="../pages/shop.html?brand=dior">Dior</a></li>
            <li><a href="../pages/shop.html?brand=ysl">YSL</a></li>
            <li><a href="../pages/shop.html?brand=burberry">Burberry</a></li>
          </ul>
        </div>
      </li>
      <!-- Sale link in mobile -->
      <!-- <li><a href="../pages/shop.html?cat=sale" class="nav-sale">Sale</a></li> -->
    </ul>
    <div class="scente-mob-footer mt-auto">
      <a href="../pages/login.html" id="mob-account-link"><i class="bi bi-person"></i> Sign In</a>
      <a href="../pages/wishlist.html"><i class="bi bi-heart"></i> Wishlist</a>
      <a href="../pages/cart.html"><i class="bi bi-bag"></i> Cart</a>
    </div>
  </div>
</div>

<script>
// Update navbar account icon based on session
(function() {
  const session = JSON.parse(sessionStorage.getItem('session'));
  const profileLink = document.getElementById('profile-link');
  const mobAccountLink = document.getElementById('mob-account-link');

  if (session && session.loggedIn) {
    if (profileLink) {
      profileLink.href = '../pages/profile.html';
      profileLink.innerHTML = '<i class="bi bi-person-check"></i>';
      profileLink.setAttribute('title', session.name || 'My Profile');
    }
    if (mobAccountLink) {
      mobAccountLink.href = '../pages/profile.html';
      mobAccountLink.innerHTML = '<i class="bi bi-person-check"></i> My Profile';
    }
  } else {
    if (profileLink) {
      profileLink.href = '../pages/login.html';
      profileLink.innerHTML = '<i class="bi bi-person"></i>';
      profileLink.setAttribute('title', 'Sign In');
    }
    if (mobAccountLink) {
      mobAccountLink.href = '../pages/login.html';
      mobAccountLink.innerHTML = '<i class="bi bi-person"></i> Sign In';
    }
  }
})();
</script>
