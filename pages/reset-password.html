<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Scenté</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="section">
  <div class="container--narrow">

    <div class="text-center mb-lg">
      <h1 class="heading-lg">Reset Password</h1>
      <p class="text-secondary mt-sm">Enter your new password below</p>
    </div>

    <div id="reset-form-wrap">
      <form id="reset-form" novalidate>

        <div class="form-group">
          <label class="form-label">New Password</label>
          <div style="position:relative;">
            <input type="password" id="new-password" class="form-input"
                   placeholder="Enter new password">
            <i class="bi bi-eye" id="toggle-new"
               style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;color:var(--color-text-secondary);"></i>
          </div>
          <small class="error-message" id="new-password-error"></small>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div style="position:relative;">
            <input type="password" id="confirm-password" class="form-input"
                   placeholder="Confirm new password">
            <i class="bi bi-eye" id="toggle-confirm"
               style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;color:var(--color-text-secondary);"></i>
          </div>
          <small class="error-message" id="confirm-password-error"></small>
        </div>

        <div class="btn-wrapper">
          <button type="submit" class="btn btn--primary mt-md">Reset Password</button>
        </div>

      </form>
    </div>

    <div id="reset-success" style="display:none; text-align:center; padding: var(--space-xl) 0;">
      <i class="bi bi-check-circle" style="font-size:48px; color:var(--color-success); display:block; margin-bottom:var(--space-lg);"></i>
      <h2 class="heading-md">Password reset!</h2>
      <p class="text-secondary mt-sm">Your password has been updated successfully.</p>
      <a href="login.html" class="btn btn--primary mt-lg" style="display:inline-block;">Sign In</a>
    </div>

    <div id="reset-invalid" style="display:none; text-align:center; padding: var(--space-xl) 0;">
      <i class="bi bi-x-circle" style="font-size:48px; color:var(--color-error); display:block; margin-bottom:var(--space-lg);"></i>
      <h2 class="heading-md">Invalid or expired link</h2>
      <p class="text-secondary mt-sm">This reset link has expired or already been used.</p>
      <a href="forgot-password.html" class="btn btn--primary mt-lg" style="display:inline-block;">Request a new link</a>
    </div>

    <div id="toast" class="toast"></div>

  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/toast.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Read token from URL: /reset-password.html?token=abc123
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token');

  const formWrap   = document.getElementById('reset-form-wrap');
  const success    = document.getElementById('reset-success');
  const invalid    = document.getElementById('reset-invalid');

  if (!token) {
    formWrap.style.display  = 'none';
    invalid.style.display   = 'block';
    return;
  }

  // Password toggles
  function setupToggle(inputId, toggleId) {
    const input  = document.getElementById(inputId);
    const toggle = document.getElementById(toggleId);
    if (!input || !toggle) return;
    toggle.addEventListener('click', () => {
      const hidden = input.type === 'password';
      input.type   = hidden ? 'text' : 'password';
      toggle.classList.toggle('bi-eye',       !hidden);
      toggle.classList.toggle('bi-eye-slash',  hidden);
    });
  }

  setupToggle('new-password',     'toggle-new');
  setupToggle('confirm-password', 'toggle-confirm');

  const form            = document.getElementById('reset-form');
  const newPwInput      = document.getElementById('new-password');
  const confirmPwInput  = document.getElementById('confirm-password');
  const newPwError      = document.getElementById('new-password-error');
  const confirmPwError  = document.getElementById('confirm-password-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    newPwError.textContent     = '';
    confirmPwError.textContent = '';
    newPwInput.classList.remove('input-error');
    confirmPwInput.classList.remove('input-error');

    const newPw     = newPwInput.value;
    const confirmPw = confirmPwInput.value;

    let valid = true;

    if (!newPw) {
      newPwError.textContent = 'Password is required';
      newPwInput.classList.add('input-error');
      valid = false;
    } else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(newPw)) {
      newPwError.innerHTML = '<i class="bi bi-exclamation-circle-fill error-icon"></i> At least 8 characters, upper & lowercase, and a number.';
      newPwInput.classList.add('input-error');
      valid = false;
    }

    if (!confirmPw) {
      confirmPwError.textContent = 'Please confirm your password';
      confirmPwInput.classList.add('input-error');
      valid = false;
    } else if (newPw && confirmPw !== newPw) {
      confirmPwError.textContent = 'Passwords do not match';
      confirmPwInput.classList.add('input-error');
      valid = false;
    }

    if (!valid) return;

    try {
      await api.post('api/auth/reset-password', {
        token,
        newPassword: newPw
      });
      formWrap.style.display = 'none';
      success.style.display  = 'block';
    } catch (err) {
      formWrap.style.display = 'none';
      invalid.style.display  = 'block';
    }
  });
});
</script>

</body>
</html>
