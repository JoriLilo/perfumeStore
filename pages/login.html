<!-- pages/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Scenté</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Project CSS -->
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>

<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<main class="section">

  <div class="container--narrow">

    <div class="text-center mb-lg">
      <h1 class="heading-lg">Sign In</h1>
      <p class="text-secondary mt-sm">Welcome back to Scenté</p>
    </div>

    <form id="login-form">

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>

        <div style="position: relative;">
            <input 
                type="password" 
                id="password" 
                class="form-input"
                placeholder="Enter your password"
                required
            >   

        <i 
            class="bi bi-eye" 
            id="togglePassword"
            style="
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                font-size: 16px;
                color: var(--color-text-secondary);
                "
            ></i>
        </div>
    </div>

      <div class="d-flex justify-between align-center mb-md">
        <a href="#" class="text-sm text-secondary">Forgot password?</a>
      </div>

      <button class="btn btn--primary btn--full">Sign In</button>

      <p class="text-center mt-lg text-sm">
        Don't have an account?
        <a href="register.html" class="text-accent">Create one</a>
      </p>

    </form>

  </div>

</main>

<!-- Footer -->
<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* Load components */
fetch('/components/navbar.html')
  .then(res => res.text())
  .then(html => document.getElementById('navbar-placeholder').innerHTML = html);

fetch('/components/footer.html')
  .then(res => res.text())
  .then(html => document.getElementById('footer-placeholder').innerHTML = html);

/* Simple validation */
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  alert("Login successful (frontend demo)");
});
</script>

</body>
</html>
