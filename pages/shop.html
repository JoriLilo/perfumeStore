<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>

  
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="/css/homepage.css">
    <link rel="stylesheet" href="/css/shop.css">

    <!-- Heart icon -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>
    
    <div id="navbar"></div>

    <div class="container">
        <div class="shop-layout">

            <!-- SIDEBAR -->
            <div class="sidebar">

                <h4>Category</h4>
                <label><input type="checkbox"> Perfume</label><br>
                <label><input type="checkbox"> Cologne</label><br>

                <h4>Price</h4>
                <input type="number" placeholder="Min" min="1"><br>
                <input type="number" placeholder="Max" min="1"><br>

                <h4>Gender</h4>
                <label><input type="radio" name="gender"> Men</label><br>
                <label><input type="radio" name="gender"> Women</label>
            </div>

            <!-- MAIN -->
            <div class="main">

                <div class="top-bar">

                    <div class="sort-bar">

                        <select>
                            <option>Price ↑</option>
                            <option>Price ↓</option>
                            <option>Newest</option>
                        </select>
                    </div>

                    <div class="pagination">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                        <button>Next</button>
                    </div>

                </div>

                
                <div class="products">

                    <!-- PRODUCT 1 -->
                    <div class="product-card">
                        <div class="product-card__image-wrap">
                           
                         <span class="product-card__badge product-card__badge--sale">Sale</span>
                            <img class="product-card__img"
                                src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.6458.2x.avif"
                                alt="Perfume">

                            <!-- Wishlist -->
                            <button class="product-card__wishlist">
                                <i class="bi bi-heart"></i>
                            </button>

                            <!-- Add to cart -->
                            <button class="product-card__quick-add">Add to Cart</button>
                        </div>

                        <p class="product-card__brand">Brand</p>
                        <h3 class="product-card__name">Perfume 1</h3>
                        <p class="product-card__price">$70</p>
                    </div>

                    <!-- PRODUCT 2 -->
                    <div class="product-card">
                        <div class="product-card__image-wrap">
                            <img class="product-card__img"
                                src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.9828.2x.avif">

                            <button class="product-card__wishlist">
                                <i class="bi bi-heart"></i>
                            </button>

                            <button class="product-card__quick-add">Add to Cart</button>
                        </div>

                        <p class="product-card__brand">Brand</p>
                        <h3 class="product-card__name">Perfume 2</h3>
                        <p class="product-card__price">$60</p>
                    </div>

                    <!-- PRODUCT 3 -->
                    <div class="product-card">
                        <div class="product-card__image-wrap">
                            <img class="product-card__img"
                                src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.2366.2x.avif">

                            <button class="product-card__wishlist">
                                <i class="bi bi-heart"></i>
                            </button>

                            <button class="product-card__quick-add">Add to Cart</button>
                        </div>

                        <p class="product-card__brand">Brand</p>
                        <h3 class="product-card__name">Perfume 3</h3>
                        <p class="product-card__price">$80</p>
                    </div>

                    <!-- PRODUCT 4 -->
                    <div class="product-card">
                        <div class="product-card__image-wrap">
                            <img class="product-card__img"
                                src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.46066.2x.avif">

                            <button class="product-card__wishlist">
                                <i class="bi bi-heart"></i>
                            </button>

                            <button class="product-card__quick-add">Add to Cart</button>
                        </div>

                        <p class="product-card__brand">Brand</p>
                        <h3 class="product-card__name">Perfume 4</h3>
                        <p class="product-card__price">$80</p>
                    </div>

                    <!-- PRODUCT 5 -->
                    <div class="product-card">
                        <div class="product-card__image-wrap">
                            <img class="product-card__img"
                                src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.46066.2x.avif">

                            <button class="product-card__wishlist">
                                <i class="bi bi-heart"></i>
                            </button>

                            <button class="product-card__quick-add">Add to Cart</button>
                        </div>

                        <p class="product-card__brand">Brand</p>
                        <h3 class="product-card__name">Perfume 5</h3>
                        <p class="product-card__price">$80</p>
                    </div>

                    <!-- PRODUCT 6 -->
                    <div class="product-card">
                        <div class="product-card__image-wrap">
                            <img class="product-card__img"
                                src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.46066.2x.avif">

                            <button class="product-card__wishlist">
                                <i class="bi bi-heart"></i>
                            </button>

                            <button class="product-card__quick-add">Add to Cart</button>
                        </div>

                        <p class="product-card__brand">Brand</p>
                        <h3 class="product-card__name">Perfume 6</h3>
                        <p class="product-card__price">$80</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

  
    <script>
    /* Load navbar and footer */
        fetch('/components/navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
            });

        fetch('/components/footer.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('footer').innerHTML = html;
            });
    </script>

</body>
</html>
