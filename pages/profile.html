<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Parfum</title>
</head>
<body>

    <!-- Navbar -->
  <div id="navbar-placeholder"></div>

    <!-- MAIN CONTENT -->
    <main>
        <h1>My Profile</h1>

        <!-- Profile Edit Form -->
        <section>
            <h2>Edit Profile</h2>

            <form>
                <!-- Avatar placeholder -->
                <div class="avatar-placeholder">
                    <span>Avatar</span>
                </div>

                <!-- Name -->
                <div>
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full_name" placeholder="Your full name">
                </div>

                <!-- Email (readonly) -->
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" readonly>
                </div>

                <!-- Change Password Section -->
                <div>
                    <h3>Change Password</h3>

                    <div>
                        <label for="old-password">Current Password</label>
                        <input type="password" id="old-password" name="old_password" placeholder="Current password">
                    </div>

                    <div>
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" name="new_password" placeholder="New password">
                    </div>

                    <div>
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm new password">
                    </div>
                </div>

                <!-- Save Button -->
                <div>
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </section>
    </main>
<!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  

  <script>
    /* Load navbar and footer */
    fetch('/components/navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;
      });

    fetch('/components/footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      });

   
  
  </script>

</body>
</html>
