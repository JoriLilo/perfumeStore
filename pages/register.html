<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Scenté</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>

<body>

<div id="navbar-placeholder"></div>

<main class="section">

  <div class="container--narrow">

    <div class="text-center mb-lg">
      <h1 class="heading-lg">Create Account</h1>
      <p class="text-secondary mt-sm">Join Scenté and discover your signature scent</p>
    </div>

    <form id="register-form" novalidate>

      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" id="firstName" class="form-input" placeholder="Enter your name">
        <small class="error-message" id="firstNameError"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Surname</label>
        <input type="text" id="lastName" class="form-input" placeholder="Enter your surname">
        <small class="error-message" id="lastNameError"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Enter your email">      
        <small class="error-message" id="emailError"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position: relative;">
        <input type="password" id="password" class="form-input" placeholder="Create a password">
        <i class="bi bi-eye"
           id="togglePassword"
           style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer;">
        </i>
        <small class="error-message" id="passwordError"></small>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div style="position: relative;">
        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password">        
        <i class="bi bi-eye"
            id="toggleConfirmPassword"
            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer;">
        </i>
        <small class="error-message" id="confirmError"></small>
        </div>
      </div>

      <div class="btn-wrapper">
        <button class="btn btn--primary mt-md">REGISTER</button>
      </div>

      <p class="text-center mt-lg text-sm">
        Already have an account?
        <a href="login.html" class="text-accent">Sign in</a>
      </p>

    </form>

  </div>

</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/cart.js"></script>

<script src="/js/auth.js"></script>

</body>
</html>
