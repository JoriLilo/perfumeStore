<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | SCENTÉ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/checkout.css">
    <link rel="stylesheet" href="/css/footer.css">
</head>
<body>

    <main class="container--narrow section">
        
        <header class="checkout-header">
            <h1 class="heading-xl text-center">Your Shopping Bag</h1>
        </header>

        <section class="bag-items-section mb-xl">
            <div class="cart-item">
                <div class="item-image">
                    <img src="/images/terroni.avif" alt="Terroni">
                </div>
                <div class="item-details">
                    <h3 class="heading-md">Terroni</h3>
                    <p class="text-sm text-secondary">Size: 50ml</p>
                    <p class="text-sm text-secondary">Qty: 1</p>
                </div>
                <div class="item-price text-lg font-medium">$155.00</div>
            </div>

            <div class="cart-item">
                <div class="item-image">
                    <img src="/images/angels share.avif" alt="Angles Share">
                </div>
                <div class="item-details">
                    <h3 class="heading-md">Angels Share</h3>
                    <p class="text-sm text-secondary">Size: 50ml</p>
                    <p class="text-sm text-secondary">Qty: 1</p>
                </div>
                <div class="item-price text-lg font-medium">$275.00</div>
            </div>
        </section>

        <section class="price-summary-section mb-xl">
            <div class="summary-row">
                <span class="text-secondary">Subtotal</span>
                <span>$430.00</span>
            </div>
            <div class="summary-row">
                <span class="text-secondary">Shipping</span>
                <span>$15.00</span>
            </div>
            <div class="summary-row grand-total mt-md pt-md">
                <span class="heading-sm">Total</span>
                <span class="heading-sm">$445.00</span>
            </div>
        </section>

        <section class="shipping-form-section">
            <h2 class="heading-lg mb-lg">Shipping & Payment Details</h2>
            <form action="/submit-order" method="POST">
                
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Jane Doe" required>
                </div>

                <div class="form-group">
                    <label for="addressLine1" class="form-label">Address Line 1</label>
                    <input type="text" id="addressLine1" name="addressLine1" class="form-input" placeholder="123 Fragrance Lane" required>
                </div>

                <div class="form-group">
                    <label for="addressLine2" class="form-label">Address Line 2 (Optional)</label>
                    <input type="text" id="addressLine2" name="addressLine2" class="form-input" placeholder="Apt, Suite, Building">
                </div>

                <div class="form-row d-grid gap-md">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="city" class="form-label">City</label>
                        <input type="text" id="city" name="city" class="form-input" placeholder="Paris" required>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="postalCode" class="form-label">Postal Code</label>
                        <input type="text" id="postalCode" name="postalCode" class="form-input" placeholder="75008" required>
                    </div>
                </div>

                <div class="form-row d-grid gap-md mt-md">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="country" class="form-label">Country</label>
                        <select id="country" name="country" class="form-select" required>
                            <option value="" disabled selected>Select a country</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="FR">France</option>
                            <option value="IT">Italy</option>
                            <option value="CA">Canada</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-input" placeholder="+1 (555) 000-0000" required>
                    </div>
                </div>

                <button type="submit" class="btn-place-order">Place Order</button>
            </form>
        </section>

    </main>

    <div class="overlay" id="orderOverlay"></div>

    <div class="checkout-modal" id="orderModal">
        <p class="modal-order-number text-sm">Order number F58635736873085</p>
        
        <h2 class="modal-heading heading-lg">Thanks for your order!</h2>
        
        <a href="/" class="btn btn-modal-home">Go to homepage</a>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const modal = document.getElementById('orderModal');
            const overlay = document.getElementById('orderOverlay');

            // Listen for the Place Order form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault(); // Prevents the page from refreshing immediately
                
                // Show the modal and the dark overlay
                modal.classList.add('active');
                overlay.classList.add('active');
            });
        });

        fetch('/components/footer.html')
        .then(res => res.text())
        .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
        });
    </script>

    
    
</body>
</html>
