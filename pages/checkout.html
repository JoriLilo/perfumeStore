<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | SCENTÉ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/checkout.css">
    <link rel="stylesheet" href="/css/footer.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/toast.js" defer></script>
    <script src="/js/cart.js" defer></script>
    <script src="/js/checkout.js" defer></script>
</head>
<body>

    <main class="container--narrow section">
        
        
        <header class="checkout-header">
            <a href="/pages/cart.html" class="btn-back-circle" aria-label="Go back to cart">
                <i class="bi bi-chevron-left"></i>
            </a>
            <h1 class="heading-xl text-center">Your Shopping Bag</h1>
        </header>

        <section class="bag-items-section mb-xl" id="cartItemsContainer">
            </section>

        <section class="price-summary-section mb-xl">
            <div class="summary-row">
                <span class="text-secondary">Subtotal</span>
                <span id="subtotalDisplay">$0.00</span>
            </div>
            <div class="summary-row">
                <span class="text-secondary">Shipping</span>
                <span id="shippingDisplay">$15.00</span>
            </div>
            <div class="summary-row grand-total mt-md pt-md">
                <span class="heading-sm">Total</span>
                <span class="heading-sm" id="grandTotalDisplay">$0.00</span>
            </div>
        </section>

        <section class="shipping-form-section">
            <h2 class="heading-lg mb-lg">Shipping & Payment Details</h2>
            <form action="/submit-order" method="POST">
                
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Jane Doe" required>
                </div>

                <div class="form-group">
                    <label for="addressLine1" class="form-label">Address Line 1</label>
                    <input type="text" id="addressLine1" name="addressLine1" class="form-input" placeholder="123 Fragrance Lane" required>
                </div>

                <div class="form-group">
                    <label for="addressLine2" class="form-label">Address Line 2 (Optional)</label>
                    <input type="text" id="addressLine2" name="addressLine2" class="form-input" placeholder="Apt, Suite, Building">
                </div>

                <div class="form-row d-grid gap-md">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="city" class="form-label">City</label>
                        <input type="text" id="city" name="city" class="form-input" placeholder="Paris" required>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="postalCode" class="form-label">Postal Code</label>
                        <input type="text" id="postalCode" name="postalCode" class="form-input" placeholder="75008" required>
                    </div>
                </div>

                <div class="form-row d-grid gap-md mt-md">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="country" class="form-label">Country</label>
                        <select id="country" name="country" class="form-select" required>
                            <option value="" disabled selected>Select a country</option>
                            <option value="AL">Albania</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="FR">France</option>
                            <option value="IT">Italy</option>
                            <option value="CA">Canada</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-input" placeholder="+1 (555) 000-0000" required>
                    </div>
                </div>

                <div class="payment-section mt-xl">
                    <h2 class="heading-lg mb-lg">Payment Method</h2>
                    
                    <div class="payment-toggle-wrapper">
                        <input type="radio" id="payPost" name="paymentMethod" value="post" checked class="sr-only">
                        <label for="payPost" class="payment-toggle-item active" id="labelPost">Post</label>
                        
                        <span class="toggle-divider">|</span>
                        
                        <input type="radio" id="payCard" name="paymentMethod" value="card" class="sr-only">
                        <label for="payCard" class="payment-toggle-item" id="labelCard">Card</label>
                    </div>

                    <div id="cardDetailsForm" class="card-details-fields d-none mt-lg">
                        <div class="form-group">
                            <label class="form-label">Card Number</label>
                            <input type="text" name="cardNumber" class="form-input" placeholder="0000 0000 0000 0000">
                        </div>
                        <div class="form-row d-grid gap-md">
                            <div class="form-group">
                                <label class="form-label">Expiry Date</label>
                                <input type="text" name="expiry" class="form-input" placeholder="MM/YY">
                            </div>
                            <div class="form-group">
                                <label class="form-label">CVV</label>
                                <input type="text" name="cvv" class="form-input" placeholder="123">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-place-order">Place Order</button>
            </form>
        </section>

    </main>

    <div class="overlay" id="orderOverlay"></div>

    <div class="checkout-modal" id="orderModal">
        <p id="orderNumberDisplay" class="modal-order-number text-sm">Order number </p>
        
        <h2 class="modal-heading heading-lg">Thank you for your order!</h2>
        
        <a href="/" class="btn btn-modal-home">Go to homepage</a>
    </div>

    <div id="footer-placeholder"></div>
    
</body>
</html>
