<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | SCENTÉ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/wishlist.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="container wishlist-wrapper">

    <!-- Page header -->
    <div class="wishlist-header">
      <div class="wishlist-header__left">
        <span class="label-caps">My Account</span>
        <h1 class="heading-lg">Wishlist</h1>
        <span id="wishlist-count">0 items</span>
      </div>
      <a href="shop.html" class="btn btn--secondary btn--sm">Continue Shopping</a>
    </div>

    <!-- Product cards injected here by wishlist.js -->
    <div id="wishlist-grid"></div>

    <!-- Empty state — hidden until wishlist is empty -->
    <div id="wishlist-empty">
      <div class="empty-icon"><i class="bi bi-heart"></i></div>
      <h2 class="empty-title">Your wishlist is empty</h2>
      <p class="empty-sub">Save items you love and find them here anytime.</p>
      <a href="shop.html" class="btn btn--primary">Browse Perfumes</a>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('../components/navbar.html')
      .then(res => res.text())
      .then(html => document.getElementById('navbar-placeholder').innerHTML = html);

    fetch('../components/footer.html')
      .then(res => res.text())
      .then(html => document.getElementById('footer-placeholder').innerHTML = html);
  </script>

  <!-- Load shared utilities first, then wishlist logic -->
  <script src="../js/cart.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/wishlist.js"></script>
  

</body>
</html>
