<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | Scenté</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/wishlist.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="wishlist-page-header">
    <div class="container">
      <span class="label-caps">My Account</span>
      <h1 class="heading-lg">My Wishlist</h1>
      <p class="wishlist-item-count" id="item-count">Loading…</p>
    </div>
  </div>

  <section class="wishlist-section">
    <div class="container">
      <div class="wishlist-toolbar" id="wishlist-toolbar">
        <span class="wishlist-toolbar__left" id="toolbar-count"></span>
        <div class="wishlist-toolbar__right">
          <select class="wishlist-sort" id="sort-select">
            <option value="default">Sort: Date Added</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
          <button class="wishlist-clear-btn" id="clear-all-btn">Clear All</button>
        </div>
      </div>

      <div class="wishlist-grid" id="wishlist-grid"></div>

      <div class="wishlist-empty" id="wishlist-empty">
        <div class="wishlist-empty__icon">
          <i class="bi bi-heart"></i>
        </div>
        <h2 class="wishlist-empty__title">Your wishlist is empty</h2>
        <p class="wishlist-empty__text">
          Save your favourite fragrances here and come back to them whenever you're ready.
        </p>
        <a href="/pages/shop.html" class="btn btn--primary">Explore Perfumes</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div class="wishlist-toast" id="wishlist-toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    /* Load navbar and footer */
    fetch('/components/navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;
      });

    fetch('/components/footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      });

   
  
  </script>


</body>
</html>
