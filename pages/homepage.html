<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCENTÉ</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Our styles -->
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">

  <style>

    /* ── Hero carousel ── */
    .hero-carousel {
      position: relative;
    }

    .hero-carousel .carousel-item {
      height: 92vh;
      min-height: 560px;
    }

    .hero-carousel .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Dark gradient so text is always readable */
    .hero-carousel .carousel-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.55) 0%,
        rgba(0, 0, 0, 0.15) 40%,
        transparent 70%
      );
    }

    /* Text overlay */
    .hero-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      padding-bottom: 80px;
      pointer-events: none;
    }

    .hero-overlay * {
      pointer-events: auto;
    }

    .hero-eyebrow {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 12px;
    }

    .hero-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(48px, 7vw, 80px);
      font-weight: 400;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.25);
      margin-bottom: 28px;
    }

    .hero-cta {
      display: inline-block;
      padding: 13px 36px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .hero-cta:hover {
      background: #ffffff;
      color: var(--color-text-primary);
    }

    /* Carousel indicators */
    .hero-carousel .carousel-indicators {
      margin-bottom: 28px;
      z-index: 11;
    }

    .hero-carousel .carousel-indicators [data-bs-target] {
      width: 28px;
      height: 2px;
      opacity: 0.45;
      background-color: white;
      border: none;
      margin: 0 4px;
      transition: opacity 0.4s ease;
    }

    .hero-carousel .carousel-indicators .active {
      opacity: 1;
    }

    /* Arrow controls — only visible on hover */
    .hero-carousel .carousel-control-prev,
    .hero-carousel .carousel-control-next {
      width: 48px;
      opacity: 0;
      z-index: 11;
      transition: opacity 0.2s ease;
    }

    .hero-carousel:hover .carousel-control-prev,
    .hero-carousel:hover .carousel-control-next {
      opacity: 1;
    }


    /* ── Featured products section ── */
    .featured-section {
      padding: 72px 40px 80px;
    }

    .featured-section__header {
      text-align: center;
      margin-bottom: 48px;
    }

    .featured-section__eyebrow {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      margin-bottom: 10px;
    }

    .featured-section__title {
      font-family: var(--font-heading);
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--color-text-primary);
    }

    /* 4-column product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }


    /* ── Product card ── */
    .product-card {
      cursor: pointer;
    }

    .product-card__image-wrap {
      position: relative;
      overflow: hidden;
      background: var(--color-surface);
      aspect-ratio: 3 / 4;
      margin-bottom: 14px;
    }

    .product-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      display: block;
    }

    /* Second image shown on hover */
    .product-card__img-hover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .product-card:hover .product-card__img {
      transform: scale(1.04);
    }

    .product-card:hover .product-card__img-hover {
      opacity: 1;
    }

    /* Quick add — slides up on hover */
    .product-card__quick-add {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26, 26, 26, 0.88);
      color: #fff;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      padding: 13px;
      border: none;
      cursor: pointer;
      transform: translateY(100%);
      transition: transform 0.3s ease, background 0.2s ease;
    }

    .product-card:hover .product-card__quick-add {
      transform: translateY(0);
    }

    .product-card__quick-add:hover {
      background: var(--color-accent);
    }

    /* Badge */
    .product-card__badge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      background: var(--color-black);
      color: #fff;
      z-index: 2;
    }

    .product-card__badge--new  { background: var(--color-accent); }
    .product-card__badge--sale { background: #c0392b; }

    /* Wishlist button */
    .product-card__wishlist {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--color-text-secondary);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s ease, color 0.2s ease;
      z-index: 2;
    }

    .product-card:hover .product-card__wishlist {
      opacity: 1;
    }

    .product-card__wishlist:hover {
      color: var(--color-accent);
    }

    /* Card text info */
    .product-card__brand {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }

    .product-card__name {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 400;
      color: var(--color-text-primary);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .product-card__name a {
      text-decoration: none;
      color: inherit;
      transition: color 0.15s ease;
    }

    .product-card__name a:hover {
      color: var(--color-accent);
    }

    .product-card__price {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 400;
      color: var(--color-text-primary);
    }

    .product-card__price--original {
      text-decoration: line-through;
      color: var(--color-text-light);
      margin-right: 6px;
    }

    .product-card__price--sale {
      color: #c0392b;
    }


    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .hero-carousel .carousel-item { height: 70vh; }
      .hero-overlay { padding-bottom: 48px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .featured-section { padding: 48px 20px 56px; }
    }

    @media (max-width: 480px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }

  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <main>

    <!-- ── Hero Carousel ── -->
    <div id="heroCarousel" class="carousel slide hero-carousel" data-bs-ride="carousel">

      <div class="carousel-indicators">
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <div class="carousel-inner">

    <div class="carousel-item active" data-bs-interval="5000">
        <img src="https://i0.wp.com/muslimgirl.com/wp-content/uploads/2024/08/Bella-hadid-‘Or%C9%99bella-e1724788273769.jpg?fit=1079%2C711&ssl=1" alt="New Collection">
    </div>

    <div class="carousel-item" data-bs-interval="5000">
        <img src="https://media.licdn.com/dms/image/v2/D5612AQHEPJdaxFb3mw/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1687090629563?e=2147483647&v=beta&t=x3BZThC0U_Bc92r6L9LYpXiOIosS22ZZKbxGvTPWGVY" alt="Spring Collection">
    </div>

    <div class="carousel-item" data-bs-interval="5000">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2sQosejy1GrbroLZYEnqCNoFhEwTtrvsKJQ&s" alt="Exclusive Scents">
    </div>

    </div>
      <!-- Overlay text + CTA -->
      <div class="hero-overlay">
        <p class="hero-eyebrow">New Collection · 2025</p>
        <h1 class="hero-title">A New Fragrance Story</h1>
        <a href="pages/shop.html" class="hero-cta">Explore the Collection</a>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>

    </div>


    <!-- ── Featured Products ── -->
    <section class="featured-section">

      <div class="featured-section__header">
        <p class="featured-section__eyebrow">Handpicked for you</p>
        <h2 class="featured-section__title">Featured Perfumes</h2>
      </div>

      <div class="product-grid">

        <!-- Card 1 -->
        <div class="product-card">
          <div class="product-card__image-wrap">
            <span class="product-card__badge product-card__badge--new">New</span>
            <img class="product-card__img"
              src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.43531.2x.avif"
              alt="Bleu de Minuit">
            <button class="product-card__wishlist" aria-label="Add to wishlist">
              <i class="bi bi-heart"></i>
            </button>
            <button class="product-card__quick-add" onclick="addToCart(1)">Add to Cart</button>
          </div>
          <p class="product-card__brand">Maison Scenté</p>
          <h3 class="product-card__name">
            <a href="pages/product-detail.html">Bleu de Minuit</a>
          </h3>
          <p class="product-card__price">$95.00</p>
        </div>

        <!-- Card 2 -->
        <div class="product-card">
          <div class="product-card__image-wrap">
            <img class="product-card__img"
              src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.9828.2x.avif"
              alt="Rose Éternelle">
            <button class="product-card__wishlist" aria-label="Add to wishlist">
              <i class="bi bi-heart"></i>
            </button>
            <button class="product-card__quick-add" onclick="addToCart(2)">Add to Cart</button>
          </div>
          <p class="product-card__brand">Chanel</p>
          <h3 class="product-card__name">
            <a href="pages/product-detail.html">Rose Éternelle</a>
          </h3>
          <p class="product-card__price">$120.00</p>
        </div>

        <!-- Card 3 -->
        <div class="product-card">
          <div class="product-card__image-wrap">
            <span class="product-card__badge product-card__badge--sale">Sale</span>
            <img class="product-card__img"
              src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.12345.2x.avif"
              alt="Oud Mystique">
            <button class="product-card__wishlist" aria-label="Add to wishlist">
              <i class="bi bi-heart"></i>
            </button>
            <button class="product-card__quick-add" onclick="addToCart(3)">Add to Cart</button>
          </div>
          <p class="product-card__brand">Dior</p>
          <h3 class="product-card__name">
            <a href="pages/product-detail.html">Oud Mystique</a>
          </h3>
          <p class="product-card__price">
            <span class="product-card__price--original">$140.00</span>
            <span class="product-card__price--sale">$98.00</span>
          </p>
        </div>

        <!-- Card 4 -->
        <div class="product-card">
          <div class="product-card__image-wrap">
            <img class="product-card__img"
              src="https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.46066.2x.avif"
              alt="Lumière Dorée">
            <button class="product-card__wishlist" aria-label="Add to wishlist">
              <i class="bi bi-heart"></i>
            </button>
            <button class="product-card__quick-add" onclick="addToCart(4)">Add to Cart</button>
          </div>
          <p class="product-card__brand">YSL</p>
          <h3 class="product-card__name">
            <a href="pages/product-detail.html">Lumière Dorée</a>
          </h3>
          <p class="product-card__price">$110.00</p>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  

  <script>
    /* Load navbar and footer */
    fetch('/components/navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;
      });

    fetch('/components/footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      });

   
  
  </script>

</body>
</html>
