<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Scenté</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="section">
  <div class="container--narrow">

    <div class="text-center mb-lg">
      <h1 class="heading-lg">Forgot Password</h1>
      <p class="text-secondary mt-sm">Enter your email and we'll send you a reset link</p>
    </div>

    <div id="forgot-form-wrap">
      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="Enter your email">
          <small class="error-message" id="forgot-email-error"></small>
        </div>

        <div class="btn-wrapper">
          <button type="submit" class="btn btn--primary mt-md">Send Reset Link</button>
        </div>

        <p class="text-center mt-lg text-sm">
          Remember your password?
          <a href="login.html" class="text-accent">Sign in</a>
        </p>
      </form>
    </div>

    <div id="forgot-success" style="display:none; text-align:center; padding: var(--space-xl) 0;">
      <i class="bi bi-envelope-check" style="font-size:48px; color:var(--color-accent); display:block; margin-bottom:var(--space-lg);"></i>
      <h2 class="heading-md">Check your email</h2>
      <p class="text-secondary mt-sm">If that email is registered, a reset link has been sent.</p>
      <a href="login.html" class="btn btn--primary mt-lg" style="display:inline-block;">Back to Sign In</a>
    </div>

    <div id="toast" class="toast"></div>

  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/toast.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form       = document.getElementById('forgot-form');
  const emailInput = document.getElementById('forgot-email');
  const emailError = document.getElementById('forgot-email-error');
  const formWrap   = document.getElementById('forgot-form-wrap');
  const success    = document.getElementById('forgot-success');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    emailError.textContent = '';
    emailInput.classList.remove('input-error');

    const email = emailInput.value.trim();

    if (!email) {
      emailError.textContent = 'Email is required';
      emailInput.classList.add('input-error');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailError.textContent = 'Enter a valid email address';
      emailInput.classList.add('input-error');
      return;
    }

    try {
      await api.post('api/auth/forgot-password', { email });
    } catch (_) {
      // Silently ignore — never reveal if email exists or not
    }

    // Always show success regardless of whether email exists
    formWrap.style.display = 'none';
    success.style.display  = 'block';
  });
});
</script>

</body>
</html>
