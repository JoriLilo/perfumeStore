<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | SCENTÉ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/cart.css">
  
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="container my-5">

    <div class="cart-heading">
      Shopping Cart
      <div class="cart-count-label" id="cart-count-label"></div>
    </div>

    <!-- Cart with items -->
    <div class="row" id="cart-content">
      <div class="col-lg-8">
        <table class="cart-table">
          <thead>
            <tr>
              <th colspan="2">Product</th>
              <th>Price</th>
              <th>Qty</th>
              <th style="text-align:right;">Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cart-tbody"></tbody>
        </table>
      </div>

      <div class="col-lg-4">
        <div class="summary-card">
          <div class="summary-title">Order Summary</div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="summary-shipping" class="summary-free">Free</span>
          </div>
          
          <div class="summary-row total">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>

         

          <a href="checkout.html" class="btn-checkout">Proceed to Checkout</a>
          <a href="/index.html" class="btn-continue">Continue Shopping</a>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div class="cart-empty d-none" id="cart-empty">
      <i class="bi bi-bag"></i>
      <h2>Your cart is empty</h2>
      <p>Looks like you haven't added anything yet.</p>
      <a href="/index.html" class="btn-checkout" style="display:inline-block;width:auto;padding:14px 40px;">Shop Now</a>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/cart.js"></script>

  <script src="/js/cartDetails.js">  </script>

</body>
</html>
