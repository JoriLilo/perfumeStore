<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | SCENTÉ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">

  <style>
    .cart-heading {
      font-family: var(--font-heading);
      font-size: var(--text-3xl);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--color-text-primary);
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 20px;
      margin-bottom: 40px;
    }

    .cart-count-label {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-top: 6px;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
    }

    .cart-table thead th {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      padding: 0 0 14px;
      border-bottom: 1px solid var(--color-border);
      background: none;
    }

    .cart-table thead th:last-child { text-align: right; }
    .cart-table tbody tr { border-bottom: 1px solid var(--color-border); }

    .cart-table tbody td {
      padding: 24px 12px 24px 0;
      vertical-align: middle;
    }

    .cart-table tbody td:last-child { padding-right: 0; }

    .cart-img {
      width: 80px;
      height: 100px;
      object-fit: cover;
      display: block;
      background: var(--color-surface);
    }

    .cart-img-placeholder {
      width: 80px;
      height: 100px;
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-border-strong);
      font-size: 24px;
    }

    .cart-brand {
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }

    .cart-name {
      font-family: var(--font-heading);
      font-size: var(--text-md);
      font-weight: 400;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }

    .cart-meta {
      font-size: var(--text-xs);
      color: var(--color-text-light);
    }

    .qty-wrap {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--color-border);
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      font-size: 15px;
      color: var(--color-text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast);
    }

    .qty-btn:hover { background: var(--color-surface); }

    .qty-num {
      width: 32px;
      text-align: center;
      font-size: var(--text-sm);
      font-weight: 400;
      border-left: 1px solid var(--color-border);
      border-right: 1px solid var(--color-border);
      line-height: 32px;
      user-select: none;
      color: var(--color-text-primary);
    }

    .cart-price { font-size: var(--text-sm); color: var(--color-text-secondary); }

    .cart-line-total {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text-primary);
      text-align: right;
    }

    .cart-remove {
      background: none;
      border: none;
      color: var(--color-text-light);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      display: block;
      margin-left: auto;
      transition: color var(--transition-fast);
    }

    .cart-remove:hover { color: var(--color-error); }

    .summary-card {
      background: var(--color-surface);
      padding: 28px;
      position: sticky;
      top: calc(var(--navbar-height) + 20px);
    }

    .summary-title {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--color-text-primary);
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: 12px;
    }

    .summary-row.total {
      border-top: 1px solid var(--color-border);
      padding-top: 14px;
      margin-top: 4px;
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .summary-free {
      color: var(--color-success);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .promo-wrap {
      display: flex;
      margin: 18px 0 6px;
    }

    .promo-input {
      flex: 1;
      border: 1px solid var(--color-border);
      border-right: none;
      padding: 9px 12px;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 300;
      background: var(--color-white);
      outline: none;
      color: var(--color-text-primary);
    }

    .promo-input::placeholder { color: var(--color-text-light); }
    .promo-input:focus { border-color: var(--color-text-primary); }

    .promo-apply {
      padding: 9px 16px;
      background: var(--color-text-primary);
      color: var(--color-white);
      border: 1px solid var(--color-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .promo-apply:hover { background: #333; }

    .promo-msg {
      font-size: var(--text-xs);
      min-height: 16px;
      margin-bottom: 18px;
    }

    .btn-checkout {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--color-btn-primary-bg);
      color: var(--color-btn-primary-text);
      border: 1px solid var(--color-btn-primary-bg);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
      transition: background var(--transition-base);
      text-decoration: none;
      margin-bottom: 10px;
    }

    .btn-checkout:hover { background: #333; color: var(--color-white); }

    .btn-continue {
      display: block;
      width: 100%;
      text-align: center;
      font-size: var(--text-xs);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      text-decoration: none;
      padding: 8px;
      transition: color var(--transition-fast);
    }

    .btn-continue:hover { color: var(--color-accent); }

    .cart-empty {
      text-align: center;
      padding: 80px 0;
    }

    .cart-empty i {
      font-size: 44px;
      color: var(--color-border-strong);
      display: block;
      margin-bottom: 20px;
    }

    .cart-empty h2 {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .cart-empty p {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: 28px;
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="container my-5">

    <div class="cart-heading">
      Shopping Cart
      <div class="cart-count-label" id="cart-count-label"></div>
    </div>

    <!-- Cart with items -->
    <div class="row" id="cart-content">
      <div class="col-lg-8">
        <table class="cart-table">
          <thead>
            <tr>
              <th colspan="2">Product</th>
              <th>Price</th>
              <th>Qty</th>
              <th style="text-align:right;">Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cart-tbody"></tbody>
        </table>
      </div>

      <div class="col-lg-4">
        <div class="summary-card">
          <div class="summary-title">Order Summary</div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="summary-shipping" class="summary-free">Free</span>
          </div>
          
          <div class="summary-row total">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>

         

          <a href="checkout.html" class="btn-checkout">Proceed to Checkout</a>
          <a href="/index.html" class="btn-continue">Continue Shopping</a>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div class="cart-empty d-none" id="cart-empty">
      <i class="bi bi-bag"></i>
      <h2>Your cart is empty</h2>
      <p>Looks like you haven't added anything yet.</p>
      <a href="/index.html" class="btn-checkout" style="display:inline-block;width:auto;padding:14px 40px;">Shop Now</a>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/cart.js"></script>

  <script>
    let appliedDiscount = 0;

    // ── Seed demo products if cart is empty ───────────────────
    function seedDemoProducts() {
      const existing = getCart();
      if (existing.length === 0) {
        const demo = [];
        localStorage.setItem('scente_cart', JSON.stringify(demo));
      }
    }

    function fmt(n) {
      return '$' + n.toFixed(2);
    }

    // ── Render cart ───────────────────────────────────────────
    function render() {
      const cart = getCart();
      const tbody = document.getElementById('cart-tbody');
      const content = document.getElementById('cart-content');
      const empty = document.getElementById('cart-empty');
      const label = document.getElementById('cart-count-label');

      tbody.innerHTML = '';

      if (cart.length === 0) {
        content.classList.add('d-none');
        empty.classList.remove('d-none');
        label.textContent = '';
        return;
      }

      content.classList.remove('d-none');
      empty.classList.add('d-none');

      const totalItems = getItemCount();
      label.textContent = totalItems + (totalItems === 1 ? ' item' : ' items');

      cart.forEach((item, i) => {
        const lineTotal = item.price * item.qty;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="width:100px; padding-right:16px;">
            ${item.image
              ? `<img src="${item.image}" alt="${item.name}" class="cart-img">`
              : `<div class="cart-img-placeholder"><i class="bi bi-image"></i></div>`}
          </td>
          <td>
            <div class="cart-brand">${item.brand || ''}</div>
            <div class="cart-name">${item.name}</div>
            ${item.size ? `<div class="cart-meta">${item.size}</div>` : ''}
          </td>
          <td class="cart-price">${fmt(item.price)}</td>
          <td>
            <div class="qty-wrap">
              <button class="qty-btn" onclick="handleQty(${i}, -1)">−</button>
              <span class="qty-num">${item.qty}</span>
              <button class="qty-btn" onclick="handleQty(${i}, 1)">+</button>
            </div>
          </td>
          <td class="cart-line-total">${fmt(lineTotal)}</td>
          <td>
            <button class="cart-remove" onclick="handleRemove(${i})" title="Remove">
              <i class="bi bi-x-lg"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      updateSummary();
    }

    // ── Summary ───────────────────────────────────────────────
    function updateSummary() {
      const subtotal = getSubtotal();
      const shipping = getShipping();
      const discountAmt = subtotal * appliedDiscount;
      const total = getTotal(appliedDiscount);

      document.getElementById('summary-subtotal').textContent = fmt(subtotal);

      const shipEl = document.getElementById('summary-shipping');
      if (shipping === 0) {
        shipEl.textContent = 'Free';
        shipEl.className = 'summary-free';
      } else {
        shipEl.textContent = fmt(shipping);
        shipEl.className = '';
      }

      document.getElementById('summary-discount').textContent =
        discountAmt > 0 ? '−' + fmt(discountAmt) : '—';
      document.getElementById('summary-total').textContent = fmt(total);
    }

    // ── Actions ───────────────────────────────────────────────
    function handleQty(index, delta) {
      updateQty(index, delta);
      render();
    }

    function handleRemove(index) {
      removeFromCart(index);
      render();
      showCartToast('Item removed from cart');
    }

    function applyPromo() {
      const code = document.getElementById('promo-input').value.trim().toUpperCase();
      const msg = document.getElementById('promo-msg');

      if (PROMO_CODES[code]) {
        appliedDiscount = PROMO_CODES[code];
        msg.style.color = 'var(--color-success)';
        msg.textContent = (appliedDiscount * 100) + '% discount applied!';
        showCartToast('Promo code applied!');
      } else {
        appliedDiscount = 0;
        msg.style.color = 'var(--color-error)';
        msg.textContent = 'Invalid promo code.';
      }

      updateSummary();
    }

    // ── Init ──────────────────────────────────────────────────
    seedDemoProducts();
    render();
  </script>

</body>
</html>
