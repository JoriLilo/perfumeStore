<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | SCENTÉ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="container my-5">
    <h1 class="mb-4">Shopping Cart</h1>

    <div class="row">
      <div class="col-lg-8">
        <table class="table align-middle">
          <thead class="table-light">
            <tr>
              <th>Product</th>
              <th>Name</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><img src="https://via.placeholder.com/60" alt="Perfume" class="rounded"></td>
              <td><strong>Love, Don't Be Shy</strong><br><small class="text-muted">Kilian</small></td>
              <td>$295.00</td>
              <td><input type="number" class="form-control form-control-sm" value="1" style="width: 60px;"></td>
              <td>$295.00</td>
              <td><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="col-lg-4">
        <div class="card p-4 shadow-sm">
          <h3 class="h5 mb-3">Order Summary</h3>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span>$295.00</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>Shipping</span>
            <span class="text-success">Free</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <strong>Total</strong>
            <strong>$295.00</strong>
          </div>
          <a href="checkout.html" class="btn btn-dark w-100 py-2">Proceed to Checkout</a>
          <a href="shop.html" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('/components/navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;
      });

    fetch('/components/footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      });
  </script>

</body>
</html>
