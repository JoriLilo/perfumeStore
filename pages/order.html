<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History — Parfum</title>
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/order.css">
</head>
<body>

    <!-- NAVBAR -->
    <div id="navbar-placeholder"></div>

    <main class="orders-page">
        <div class="orders-container">

            <!-- Page header -->
            <div class="orders-page-header">
                <span class="orders-page-header__eyebrow">My Account</span>
                <h1 class="orders-page-header__title">Order History</h1>
            </div>

            <!-- Main card -->
            <div class="orders-card">

                <!-- Tabs -->
                <div class="orders-card__tabs">
                    <div class="tabs-left">
                        <button class="otab active" data-filter="all">All Orders <span class="otab__n">(0)</span></button>
                        <button class="otab" data-filter="delivered">Delivered <span class="otab__n">(0)</span></button>
                        <button class="otab" data-filter="shipped">Shipped <span class="otab__n">(0)</span></button>
                        <button class="otab" data-filter="pending">Pending <span class="otab__n">(0)</span></button>
                    </div>
                    <div class="tabs-search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input type="text" placeholder="Search orders..." id="searchInput">
                    </div>
                </div>

                <!-- Table (desktop) -->
                <div class="otable-wrap">
                    <table class="otable">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Product</th>
                                <th>Date</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Total</th>
                                <th>Invoice</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>

                <!-- Mobile cards -->
                <div class="mcards">
                    <!-- JS will populate this -->
                </div>

            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script>
        fetch('../components/navbar.html')
            .then(r => r.text())
            .then(h => document.getElementById('navbar-placeholder').innerHTML = h);
        fetch('../components/footer.html')
            .then(r => r.text())
            .then(h => document.getElementById('footer-placeholder').innerHTML = h);

        // Filters
        document.querySelectorAll('.otab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.otab').forEach(b => b.classList.remove('active'));
                t.classList.add('active');
                const f = t.dataset.filter;
                document.querySelectorAll('[data-status]').forEach(el => {
                    el.style.display = (f === 'all' || el.dataset.status === f) ? '' : 'none';
                });
            });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('[data-status]').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        });
    </script>
    <script src="../js/toast.js"></script>
    <script src="../js/order.js"></script>

</body>
</html>
