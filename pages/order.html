<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History — Parfum</title>
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/orders.css">
</head>
<body>

    <!-- NAVBAR — loaded via fetch -->
    <div id="navbar-placeholder"></div>

    <!-- MAIN CONTENT -->
    <main class="container orders-wrapper">

        <!-- Page header -->
        <div class="page-header">
            <div class="page-header-left">
                <span class="label-caps">My Account</span>
                <h1 class="heading-lg">Order History</h1>
            </div>
            <p class="order-count">3 orders placed</p>
        </div>

        <!-- Orders list — card layout -->
        <div class="orders-list">

            <!-- Order 1 -->
            <div class="order-card">
                <div class="order-card__header">
                    <span class="order-card__number">Order #00123</span>
                    <span class="order-card__date">June 1, 2025</span>
                </div>
                <div class="order-card__body">
                    <div>
                        <p class="order-card__total-label">Order Total</p>
                        <p class="order-card__total-amount">$89.99</p>
                    </div>
                    <div class="order-card__actions">
                        <span class="status-badge delivered">Delivered</span>
                        <a href="#" class="view-link">View Details →</a>
                    </div>
                </div>
            </div>

            <!-- Order 2 -->
            <div class="order-card">
                <div class="order-card__header">
                    <span class="order-card__number">Order #00118</span>
                    <span class="order-card__date">May 14, 2025</span>
                </div>
                <div class="order-card__body">
                    <div>
                        <p class="order-card__total-label">Order Total</p>
                        <p class="order-card__total-amount">$54.00</p>
                    </div>
                    <div class="order-card__actions">
                        <span class="status-badge shipped">Shipped</span>
                        <a href="#" class="view-link">View Details →</a>
                    </div>
                </div>
            </div>

            <!-- Order 3 -->
            <div class="order-card">
                <div class="order-card__header">
                    <span class="order-card__number">Order #00105</span>
                    <span class="order-card__date">April 22, 2025</span>
                </div>
                <div class="order-card__body">
                    <div>
                        <p class="order-card__total-label">Order Total</p>
                        <p class="order-card__total-amount">$120.50</p>
                    </div>
                    <div class="order-card__actions">
                        <span class="status-badge pending">Pending</span>
                        <a href="#" class="view-link">View Details →</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER — loaded via fetch -->
    <div id="footer-placeholder"></div>

    <script>
        fetch('../components/navbar.html')
            .then(res => res.text())
            .then(html => document.getElementById('navbar-placeholder').innerHTML = html);

        fetch('../components/footer.html')
            .then(res => res.text())
            .then(html => document.getElementById('footer-placeholder').innerHTML = html);
    </script>

</body>
</html>
