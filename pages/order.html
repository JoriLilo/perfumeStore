<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History — SCENTÉ</title>
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/order.css">

    <style>
        #invoice-modal { display: none; }
        #invoice-modal.active { display: flex; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div id="navbar-placeholder"></div>

    <main class="orders-page">
        <div class="orders-container">

            <!-- Page header -->
            <div class="orders-page-header">
                <span class="orders-page-header__eyebrow">My Account</span>
                <h1 class="orders-page-header__title">Order History</h1>
            </div>

            <!-- Main card -->
            <div class="orders-card">

                <!-- Tabs -->
                <div class="orders-card__tabs">
                    <div class="tabs-left">
                        <button class="otab active" data-filter="all">All Orders <span class="otab__n" id="count-all">(0)</span></button>
                        <button class="otab" data-filter="delivered">Delivered <span class="otab__n" id="count-delivered">(0)</span></button>
                        <button class="otab" data-filter="shipped">Shipped <span class="otab__n" id="count-shipped">(0)</span></button>
                        <button class="otab" data-filter="pending">Pending <span class="otab__n" id="count-pending">(0)</span></button>
                    </div>
                    <div class="tabs-search">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Search orders..." id="searchInput">
                    </div>
                </div>

                <!-- Table (desktop) -->
                <div class="otable-wrap">
                    <table class="otable">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Product</th>
                                <th>Date</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Total</th>
                                <th>Invoice</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body"></tbody>
                    </table>
                </div>

                <!-- Mobile cards -->
                <div class="mcards" id="mobile-orders-container"></div>

            </div>

        </div>

        <!-- Invoice Modal -->
        <div id="invoice-modal" style="
            position:fixed;
            inset:0;
            background:rgba(26,26,26,0.55);
            z-index:1000;
            align-items:center;
            justify-content:center;
            backdrop-filter:blur(4px);
        ">
            <div style="
                background:#fff;
                width:92%;
                max-width:880px;
                height:88vh;
                display:flex;
                flex-direction:column;
                border-radius:2px;
                overflow:hidden;
                box-shadow:0 24px 64px rgba(0,0,0,0.18);
            ">
                <!-- Modal header -->
                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    padding:16px 28px;
                    border-bottom:1px solid #ece4e0;
                    background:#fdf8f6;
                    flex-shrink:0;
                ">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <i class="bi bi-file-earmark-text" style="font-size:15px;color:#d4808a;"></i>
                        <span style="
                            font-family:'Jost',sans-serif;
                            font-size:11px;
                            font-weight:500;
                            letter-spacing:0.16em;
                            text-transform:uppercase;
                            color:#1a1a1a;
                        ">Invoice</span>
                    </div>
                    <button onclick="closeInvoiceModal()" style="
                        width:32px;
                        height:32px;
                        border-radius:50%;
                        border:1px solid #ece4e0;
                        background:#fff;
                        font-size:15px;
                        cursor:pointer;
                        color:#6b6b6b;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        transition:all 0.2s ease;
                    "
                    onmouseover="this.style.background='#1a1a1a';this.style.color='#fff';this.style.borderColor='#1a1a1a';"
                    onmouseout="this.style.background='#fff';this.style.color='#6b6b6b';this.style.borderColor='#ece4e0';"
                    >✕</button>
                </div>
                <!-- PDF iframe -->
                <iframe id="invoice-frame" src="" style="flex:1;border:none;width:100%;"></iframe>
            </div>
        </div>  

    </main>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/order.js"></script>

</body>
</html>
